<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보호구역 모니터링 대시보드</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQx/UXR2v9n2mcp0LyfY5vT1P3wZP6Y="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css?v=20260726-2" />
  </head>
  <body>
    <main class="app-shell">
      <section class="side-panel" aria-label="변경 감지 요약">
        <header class="panel-header">
          <p class="eyebrow">Safety Zone Monitor</p>
          <div class="header-title-row">
            <h1 data-i18n="appTitle">보호구역 변경 현황</h1>
            <div class="language-toggle" aria-label="Language">
              <button type="button" data-language="ko">KR</button>
              <button type="button" data-language="en">EN</button>
            </div>
          </div>
          <p id="last-updated" class="muted" data-i18n="loadingData">데이터를 불러오는 중</p>
        </header>

        <section class="metrics" aria-label="현재 등록 현황">
          <article class="metric">
            <span class="metric-label">Polygon</span>
            <strong id="polygon-count">0</strong>
          </article>
          <article class="metric">
            <span class="metric-label">Point</span>
            <strong id="point-count">0</strong>
          </article>
          <article class="metric">
            <span class="metric-label" data-i18n="sgg">시군구</span>
            <strong id="sgg-count">0</strong>
          </article>
        </section>

        <section class="toolbar" aria-label="보호구역 및 변경 레이어 선택">
          <label><input type="checkbox" data-layer="currentChild" checked /> <span data-i18n="child">어린이</span></label>
          <label><input type="checkbox" data-layer="currentSenior" checked /> <span data-i18n="senior">노인</span></label>
          <label><input type="checkbox" data-layer="currentDisabled" checked /> <span data-i18n="disabled">장애인</span></label>
          <label><input type="checkbox" data-layer="currentOther" checked /> <span data-i18n="other">기타</span></label>
          <label><input type="checkbox" data-layer="new" checked /> <span data-i18n="new">신규</span></label>
          <label><input type="checkbox" data-layer="changed" checked /> <span data-i18n="changed">변경</span></label>
          <label><input type="checkbox" data-layer="review" checked /> <span data-i18n="review">삭제(검토)</span></label>
        </section>

        <section class="activity-shell" aria-label="운영 이력">
          <div class="activity-tabs" role="tablist" aria-label="이력 보기 선택">
            <button
              id="events-tab"
              class="activity-tab active"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="events-panel"
              data-panel="events"
            >
              <span class="tab-label" data-i18n="recentChanges">최근 변경</span>
              <span id="event-total">0건</span>
            </button>
            <button
              id="current-tab"
              class="activity-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="current-panel"
              data-panel="current"
            >
              <span class="tab-label" data-i18n="currentObjects">현재 객체</span>
              <span id="current-total">0건</span>
            </button>
            <button
              id="runs-tab"
              class="activity-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="runs-panel"
              data-panel="runs"
            >
              <span class="tab-label" data-i18n="monitoringRuns">모니터링 이력</span>
              <span id="run-total">0건</span>
            </button>
          </div>

          <section
            id="events-panel"
            class="activity-panel active"
            role="tabpanel"
            aria-labelledby="events-tab"
          >
            <div class="filters" aria-label="변경 이력 필터">
              <input
                id="event-search"
                type="search"
                placeholder="시설명, 관리번호, 시군구 검색"
                data-i18n-placeholder="searchPlaceholder"
              />
              <select id="event-type">
                <option value="" data-i18n="allChangeStatus">전체 변경 상태</option>
                <option value="NEW" data-change-label="NEW">신규</option>
                <option value="ATTRIBUTE_CHANGED" data-change-label="ATTRIBUTE_CHANGED">속성변경</option>
                <option value="GEOMETRY_CHANGED" data-change-label="GEOMETRY_CHANGED">도형변경</option>
                <option value="GEOMETRY_ATTRIBUTE_CHANGED" data-change-label="GEOMETRY_ATTRIBUTE_CHANGED">도형+속성변경</option>
                <option value="POINT_CHANGED" data-change-label="POINT_CHANGED">위치변경</option>
                <option value="POINT_ATTRIBUTE_CHANGED" data-change-label="POINT_ATTRIBUTE_CHANGED">위치+속성변경</option>
                <option value="DELETED" data-change-label="DELETED">삭제</option>
                <option value="MISSING" data-change-label="MISSING">누락 검토</option>
              </select>
              <div id="change-region-summary" class="region-summary"></div>
            </div>
            <ol id="event-list" class="event-list"></ol>
          </section>

          <section
            id="current-panel"
            class="activity-panel"
            role="tabpanel"
            aria-labelledby="current-tab"
            hidden
          >
            <div class="filters" aria-label="현재 객체 필터">
              <select id="current-sido" aria-label="현재 객체 시도 선택"></select>
              <div id="current-region-summary" class="region-summary"></div>
              <input
                id="current-search"
                type="search"
                placeholder="시설명, 관리번호, 시군구 검색"
                data-i18n-placeholder="searchPlaceholder"
              />
              <select id="current-zone-type">
                <option value="" data-i18n="allZoneTypes">전체 보호구역 종류</option>
                <option value="ZONE:1" data-i18n="child">어린이</option>
                <option value="ZONE:2" data-i18n="senior">노인</option>
                <option value="ZONE:3" data-i18n="disabled">장애인</option>
                <option value="ZONE:OTHER" data-i18n="other">기타</option>
              </select>
            </div>
            <ol id="current-list" class="current-list"></ol>
          </section>

          <section
            id="runs-panel"
            class="activity-panel"
            role="tabpanel"
            aria-labelledby="runs-tab"
            hidden
          >
            <ol id="run-list" class="run-list"></ol>
          </section>
        </section>
      </section>

      <section class="map-panel" aria-label="보호구역 지도">
        <div id="map"></div>
        <div id="kakao-map" hidden></div>
        <button class="panel-toggle" type="button" aria-expanded="true" data-i18n="panelClose">현황판 접기</button>
        <div class="map-mode-control" aria-label="지도 전환">
          <button class="map-mode-button active" type="button" data-map-mode="osm">OSM</button>
          <button class="map-mode-button" type="button" data-map-mode="kakao">Kakao</button>
          <button class="map-mode-button roadview-action" type="button" data-map-mode="roadview">
            Roadview
          </button>
        </div>
        <section class="roadview-panel" aria-label="카카오 로드뷰" hidden>
          <div class="roadview-header">
            <strong id="roadview-title" data-i18n="roadview">로드뷰</strong>
            <button id="roadview-close" type="button" aria-label="로드뷰 닫기">×</button>
          </div>
          <p id="roadview-status" class="roadview-status">
            <span data-i18n="roadviewHint">보호구역을 선택하면 로드뷰를 확인할 수 있습니다.</span>
          </p>
          <div id="roadview"></div>
          <button class="roadview-resize" type="button" aria-label="로드뷰 크기 조정"></button>
        </section>
        <div class="legend" aria-label="지도 범례">
          <span><i class="swatch zone-child"></i><span data-i18n="child">어린이</span></span>
          <span><i class="swatch zone-senior"></i><span data-i18n="senior">노인</span></span>
          <span><i class="swatch zone-disabled"></i><span data-i18n="disabled">장애인</span></span>
          <span><i class="swatch zone-other"></i><span data-i18n="other">기타</span></span>
          <span><i class="swatch change-new"></i><span data-i18n="new">신규</span></span>
          <span><i class="swatch change-updated"></i><span data-i18n="changed">변경</span></span>
          <span><i class="swatch change-deleted"></i><span data-i18n="review">삭제(검토)</span></span>
        </div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="config.js?v=20260726-2"></script>
    <script src="app.js?v=20260726-2"></script>
  </body>
</html>
