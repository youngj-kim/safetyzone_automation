name: Daily safety-zone monitor

on:
  schedule:
    - cron: "0 0 * * *" # 09:00 KST, chunk 01
    - cron: "20 0 * * *" # 09:20 KST, chunk 02
    - cron: "40 0 * * *" # 09:40 KST, chunk 03
    - cron: "0 1 * * *" # 10:00 KST, chunk 04
    - cron: "20 1 * * *" # 10:20 KST, chunk 05
    - cron: "40 1 * * *" # 10:40 KST, chunk 06
  workflow_dispatch:
    inputs:
      notification_test:
        description: "Send a notification test message only; skip DB monitoring"
        required: false
        default: "false"
      sgg_codes_file:
        description: "Optional SGG code file override, e.g. config/sgg_chunks/nationwide_chunk_01.txt"
        required: false
        default: ""
      baseline_load:
        description: "Load current/snapshot rows without change events or notifications"
        required: false
        default: "false"
      prepare_db:
        description: "Run operational DB migrations before monitoring"
        required: false
        default: "false"

concurrency:
  group: safety-zone-daily-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SAFETYZONE_DB_MODE: cloud
      OPEN_API_SERVICE_KEY: ${{ secrets.OPEN_API_SERVICE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SGG_CODES: ${{ vars.SGG_CODES }}
      SGG_CODES_FILE_DEFAULT: ${{ vars.SGG_CODES_FILE || 'config/sgg_codes_nationwide.txt' }}
      API_REQUEST_DELAY_SECONDS: ${{ vars.API_REQUEST_DELAY_SECONDS || '1.0' }}
      API_RATE_LIMIT_MAX_RETRIES: ${{ vars.API_RATE_LIMIT_MAX_RETRIES || '5' }}
      API_RATE_LIMIT_RETRY_SECONDS: ${{ vars.API_RATE_LIMIT_RETRY_SECONDS || '60' }}
      SNAPSHOT_RETENTION_DAYS: ${{ vars.SNAPSHOT_RETENTION_DAYS || '35' }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Send notification test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notification_test == 'true' }}
        run: python -m safety_zone_monitor test-notification
      - name: Resolve SGG codes file
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.notification_test == 'true') }}
        run: |
          manual_file="${{ github.event_name == 'workflow_dispatch' && inputs.sgg_codes_file || '' }}"
          if [ -n "$manual_file" ]; then
            selected_file="$manual_file"
          else
            case "${{ github.event.schedule }}" in
              "0 0 * * *") selected_file="config/sgg_chunks/nationwide_chunk_01.txt" ;;
              "20 0 * * *") selected_file="config/sgg_chunks/nationwide_chunk_02.txt" ;;
              "40 0 * * *") selected_file="config/sgg_chunks/nationwide_chunk_03.txt" ;;
              "0 1 * * *") selected_file="config/sgg_chunks/nationwide_chunk_04.txt" ;;
              "20 1 * * *") selected_file="config/sgg_chunks/nationwide_chunk_05.txt" ;;
              "40 1 * * *") selected_file="config/sgg_chunks/nationwide_chunk_06.txt" ;;
              *) selected_file="$SGG_CODES_FILE_DEFAULT" ;;
            esac
          fi
          echo "SGG_CODES_FILE=$selected_file" >> "$GITHUB_ENV"
          echo "Using SGG_CODES_FILE=$selected_file"
      - name: Prepare operational database
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_db == 'true' && inputs.notification_test != 'true' }}
        run: python -m safety_zone_monitor init-ops-db
      - name: Verify operational database
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.notification_test == 'true') }}
        run: python -m safety_zone_monitor audit-ops-db
      - name: Run daily monitor
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.notification_test == 'true') }}
        run: |
          baseline_arg=""
          if [ "${{ inputs.baseline_load }}" = "true" ]; then
            baseline_arg="--baseline"
          fi
          python -m safety_zone_monitor run $baseline_arg --summary-json run_summary.json
      - name: Verify safety-zone data quality
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.notification_test == 'true') }}
        run: python -m safety_zone_monitor quality-report
      - name: Check detected changes
        id: detected_changes
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.notification_test == 'true') }}
        run: |
          has_changes="$(python -c "import json; print(str(json.load(open('run_summary.json', encoding='utf-8'))['has_changes']).lower())")"
          echo "has_changes=${has_changes}" >> "$GITHUB_OUTPUT"
          if [ "$has_changes" = "true" ] || [ "${{ inputs.baseline_load }}" = "true" ]; then
            echo "full_dashboard_export=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_dashboard_export=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Export dashboard data
        if: ${{ steps.detected_changes.outputs.full_dashboard_export == 'true' }}
        run: python -m safety_zone_monitor export-dashboard --output dashboard/data --event-limit 500 --baseline-date 2026-07-25
      - name: Commit dashboard data
        if: ${{ steps.detected_changes.outputs.full_dashboard_export == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data
          if ! git diff --cached --quiet; then
            git commit -m "Update dashboard data after safety-zone changes"
            git push
          else
            echo No dashboard data changes to commit.
          fi
      - name: Export monitoring history
        id: export_monitoring_history
        if: ${{ always() && steps.detected_changes.outputs.full_dashboard_export != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.notification_test == 'true') }}
        run: python -m safety_zone_monitor export-dashboard --output dashboard/data --overview-only
      - name: Commit monitoring history
        if: ${{ always() && steps.export_monitoring_history.outcome == 'success' && steps.detected_changes.outputs.full_dashboard_export != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.notification_test == 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/overview.json
          if ! git diff --cached --quiet; then
            git commit -m "Update dashboard monitoring history"
            git push
          else
            echo No monitoring history changes to commit.
          fi
      - name: Prune cloud snapshot payloads
        if: ${{ always() && steps.detected_changes.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.notification_test == 'true') }}
        run: |
          run_id="$(python -c "import json; print(json.load(open('run_summary.json', encoding='utf-8'))['run_id'])")"
          python -m safety_zone_monitor prune-snapshots --run-id "$run_id" --baseline-date 2026-07-25
          python -m safety_zone_monitor prune-snapshots --retention-days "$SNAPSHOT_RETENTION_DAYS" --baseline-date 2026-07-25
